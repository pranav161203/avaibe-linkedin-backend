# Tool settings for the backend. Dependencies stay in requirements.txt (runtime) and requirements-dev.txt.

[project]
name = "avaibe-linkedin-backend"
version = "1.0.0"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 150
extend-exclude = ["core/migrations"]

[tool.ruff.lint]
# F: real errors (undefined names, unused imports); E4/E7/E9: syntax and statement problems; I: sorted imports
select = ["F", "E4", "E7", "E9", "I"]

[tool.ruff.lint.isort]
known-first-party = ["core", "config", "dev_tools"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F405"]  # names come from `from .base import *`
